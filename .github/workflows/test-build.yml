# Test builds only: compiles the firmware on claude/test-* branches and keeps the .bin as a run artifact.
# Publishes nothing (no Pages, no website, no updates for cards).
name: Test build (firmware only)

on:
  push:
    branches: ['claude/test-*']

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tools
        run: npm ci
        working-directory: tools
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core and libraries (pinned)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.13
          arduino-cli lib install "ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0" "Adafruit GFX Library@1.13.0" "Adafruit BusIO@1.17.4" "AnimatedGIF@2.2.0" "JPEGDEC@1.8.5" "PNGdec@1.1.6"
      - name: Web app
        run: node tools/build-web.mjs
      - name: Compile
        working-directory: firmware
        run: arduino-cli compile -b "esp32:esp32:esp32s3:FlashMode=dio,FlashSize=8M,CDCOnBoot=cdc,USBMode=hwcdc,PSRAM=disabled" --build-property upload.maximum_size=1835008 --output-dir build/pocket_jumbotron pocket_jumbotron
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: firmware/build/pocket_jumbotron/pocket_jumbotron.ino.bin
