# Builds the firmware + starter pack install image and publishes the website (docs/ + docs/firmware/)
# to GitHub Pages. The install page and future wireless updates download from there.
name: Build firmware and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'   # hourly: picks up changes in the private content repo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PRIVATE: ${{ secrets.CONTENT_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Node tools
        run: npm ci
        working-directory: tools

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-3.3.13-v1

      - name: ESP32 core and libraries (pinned)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.13
          arduino-cli lib install "ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0" "Adafruit GFX Library@1.13.0" "Adafruit BusIO@1.17.4" "AnimatedGIF@2.2.0" "JPEGDEC@1.8.5"

      - name: Web app (docs/app, loaded by the card's front page)
        run: node tools/build-web.mjs

      # Fails the run before anything is published: pages that don't parse, page/firmware mismatches, bad version.
      - name: Checks
        run: node tools/test.mjs

      # The pictures live in a private repo, so they aren't browsable on GitHub; the packs on the website and the
      # install image's first show are built from it (the website itself is public).
      - name: Picture source (private repo, read-only deploy key)
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@v4
        with:
          repository: hogfanboy/pocket-jumbotron-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: private-content

      - name: Build install image
        run: node tools/build-install.mjs private-content

      - name: Market feeds (the cards read these over HTTPS)
        run: node tools/build-feeds.mjs

      - name: Build picture packs
        run: node tools/build-packs.mjs private-content

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
