<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Bridge Test</title>
<style>
  :root { --bg: #111; --fg: #ddd; --muted: #888; --ok: #6c6; --bad: #e66; --btn: #2a6; }
  body { background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; margin: 0; padding: 16px; max-width: 640px; }
  input { font: inherit; padding: 8px; width: 160px; }
  button { font: inherit; padding: 10px 14px; margin: 6px 6px 6px 0; background: var(--btn); color: #fff; border: 0; border-radius: 6px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #000; padding: 10px; border-radius: 6px; min-height: 120px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<h2>Website → card test</h2>
<p class="muted">Checks two ways this https website can control a card on your home WiFi.</p>
<p>Card address: <input id="ip" placeholder="192.168.50.16"></p>
<button id="direct">1. Direct (Chrome may ask to allow local devices)</button>
<button id="bridge">2. Through the bridge tab</button>
<pre id="log"></pre>
<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += m + '\n'; console.log(m); };
const q = new URLSearchParams(location.search);
$('ip').value = q.get('ip') || (() => { try { return localStorage.getItem('bridgeIp') || ''; } catch (e) { return ''; } })();
const ip = () => { const v = $('ip').value.trim(); try { localStorage.setItem('bridgeIp', v); } catch (e) {} return v; };

$('direct').onclick = async () => {
  const t = performance.now();
  try {
    const r = await fetch(`http://${ip()}/api/info`, { targetAddressSpace: 'local' });
    const j = await r.json();
    log(`Direct: OK in ${Math.round(performance.now() - t)} ms, fw ${j.fw}, ${j.name}`);
  } catch (e) { log('Direct: blocked (' + e + ')'); }
};

let win = null, peer = null, waiting = {}, nextId = 1;
addEventListener('message', e => {
  if (!peer || e.origin !== peer || !e.data) return;
  const d = e.data;
  if ('ready' in d && !d.id) { if (!d.ready) win.postMessage({ hello: 1 }, peer); else log('Bridge: connected to ' + d.host); return; }
  if (waiting[d.id]) { waiting[d.id](d); delete waiting[d.id]; }
});
const ask = (msg, transfer) => new Promise((res, rej) => {
  const id = nextId++; waiting[id] = res;
  win.postMessage({ ...msg, id }, peer, transfer || []);
  setTimeout(() => { if (waiting[id]) { delete waiting[id]; rej(new Error('no answer')); } }, 15000);
});
$('bridge').onclick = async () => {
  peer = `http://${ip()}`;
  win = window.open(`${peer}/bridge`, 'pjbridge');
  if (!win) { log('Bridge: pop-up blocked'); return; }
  log('Bridge: opened ' + peer + '/bridge, waiting...');
  // The bridge announces itself; also say hello in case its first message came before we listened.
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 500));
    try { win.postMessage({ hello: 1 }, peer); } catch (e) {}
    try {
      let t = performance.now();
      const info = await Promise.race([ask({ path: '/api/info' }), new Promise((_, r) => setTimeout(r, 400))]);
      log(`Bridge: /api/info ${info.status} in ${Math.round(performance.now() - t)} ms: ${info.text.slice(0, 80)}...`);
      const big = new Uint8Array(300 * 1024).buffer;
      t = performance.now();
      const p = await ask({ probe: big }, [big]);
      log(`Bridge: handed over a ${Math.round(p.bytes / 1024)} KB file in ${Math.round(performance.now() - t)} ms`);
      t = performance.now();
      const show = await ask({ path: '/api/show' });
      log(`Bridge: /api/show ${show.status} in ${Math.round(performance.now() - t)} ms (${show.text.length} bytes)`);
      log('Bridge: WORKS');
      return;
    } catch (e) {}
  }
  log('Bridge: no answer from the card after 10 s');
};
</script>
</body>
</html>
